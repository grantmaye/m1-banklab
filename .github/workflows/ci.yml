name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Maven tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run tests
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Require PostgreSQL integration tests to execute
        run: |
          python3 - <<'PYCI'
          import xml.etree.ElementTree as ET
          suite = ET.parse("target/surefire-reports/TEST-com.m1banklab.BankingFlowIntegrationTest.xml").getroot()
          assert int(suite.attrib["tests"]) > 0
          assert int(suite.attrib["skipped"]) == 0, "PostgreSQL tests must not silently skip in CI"
          PYCI
