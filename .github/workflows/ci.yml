name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Maven tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run tests
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Require PostgreSQL integration tests to execute
        run: |
          python3 - <<'PYCI'
          import xml.etree.ElementTree as ET
          suite = ET.parse("target/surefire-reports/TEST-com.m1banklab.BankingFlowIntegrationTest.xml").getroot()
          assert int(suite.attrib["tests"]) > 0
          assert int(suite.attrib["skipped"]) == 0, "PostgreSQL tests must not silently skip in CI"
          PYCI

  browser:
    name: Browser → Spring → PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: m1_banklab
          POSTGRES_USER: m1_banklab
          POSTGRES_PASSWORD: m1_banklab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U m1_banklab"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://127.0.0.1:5432/m1_banklab
      SPRING_DATASOURCE_USERNAME: m1_banklab
      SPRING_DATASOURCE_PASSWORD: m1_banklab
      BANKLAB_TEST_DATABASE_URL: postgresql://m1_banklab:m1_banklab@127.0.0.1:5432/m1_banklab
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - name: Build the real Spring application
        run: mvn --batch-mode --no-transfer-progress -DskipTests package
      - name: Install browser test dependencies
        run: npm ci
      - name: Verify exact decimal handling
        run: npm test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Exercise the desk against PostgreSQL
        run: npm run test:browser
      - name: Retain browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: banking-desk-browser-evidence
          path: |
            playwright-report/
            test-results/
          retention-days: 14
